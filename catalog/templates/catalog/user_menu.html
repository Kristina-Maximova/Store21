<div class="fixed-bottom">
    <div class="btn-group dropup"
         style="margin-top: 1rem; padding-top: 1rem; border-top: 3px solid hwb(199 0% 29%)">
        <button class="btn btn-secondary dropdown-toggle  btn-dark p-3 " type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                 class="bi bi-emoji-smile-upside-down" viewBox="0 0 16 16">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1m0-1a8 8 0 1 1 0 16A8 8 0 0 1 8 0"/>
                <path d="M4.285 6.433a.5.5 0 0 0 .683-.183A3.5 3.5 0 0 1 8 4.5c1.295 0 2.426.703 3.032 1.75a.5.5 0 0 0 .866-.5A4.5 4.5 0 0 0 8 3.5a4.5 4.5 0 0 0-3.898 2.25.5.5 0 0 0 .183.683M7 9.5C7 8.672 6.552 8 6 8s-1 .672-1 1.5.448 1.5 1 1.5 1-.672 1-1.5m4 0c0-.828-.448-1.5-1-1.5s-1 .672-1 1.5.448 1.5 1 1.5 1-.672 1-1.5"/>
            </svg>
            Пользователь
        </button>
        <ul class="dropdown-menu dropdown-menu-dark">
            {% if user.is_authenticated %}

                <li><a class="dropdown-item p-3" href="{% url 'catalog:create_product' %}">Добавить продукт</a></li>
                <li>
                    <form method="post" action="{% url 'users:logout' %}" style="display:inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link dropdown-item p-3">Выйти</button>
                    </form>
                    <!-- <a class="dropdown-item" href="#">Выйти</a> -->
                </li>
            {% else %}
                <li><a class="dropdown-item p-3" href="{% url 'users:login' %}">Войти</a></li>
                <li><a class="dropdown-item p-3" href="{% url 'users:register' %}">Регистрация</a></li>
            {% endif %}
        </ul>
    </div>
</div>
