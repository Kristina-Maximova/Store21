[tool.poetry]
name = "pythonproject12"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "1.1.0"
django-phonenumber-field = {extras = ["phonenumberslite"], version = "^8.1.0"}
asgiref = "3.8.1"
asttokens = "3.0.0"
click = "8.1.8"
colorama = "0.4.6"
decorator = "5.2.1"
django = "5.2"
executing = "2.2.0"
ipython = "9.1.0"
ipython-pygments-lexers = "1.1.1"
jedi = "0.19.2"
matplotlib-inline = "0.1.7"
mccabe = "0.7.0"
packaging = "24.2"
parso = "0.8.4"
pathspec = "0.12.1"
pillow = "11.2.1"
platformdirs = "4.3.7"
prompt-toolkit = "3.0.51"
psycopg2-binary = "2.9.10"
pure-eval = "0.2.3"
pycodestyle = "2.13.0"
pyflakes = "3.3.2"
pygments = "2.19.1"
sqlparse = "0.5.3"
stack-data = "0.6.3"
traitlets = "5.14.3"
typing-extensions = "4.13.1"
tzdata = "2025.2"
wcwidth = "0.2.13"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy-extensions = "1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'

[tool.black]
line_length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py

)
'''

[tool.isort]
line_length = 119
multi_line_output = 3
